name: Build GKI android12-5.10

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch manifest AOSP"
        default: "common-android12-5.10-lts"
        required: true
      kernel_name:
        description: "masryan-kernel-v1"
        default: "masryan-kernel-v1"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Kosongkan disk runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Tambah swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Pasang dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 libx11-dev lib32z1-dev \
            libxml2-utils xsltproc unzip bc libssl-dev libelf-dev python3 \
            rsync cpio lz4 libgl1-mesa-dev
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Ambil source kernel
        run: |
          mkdir -p ~/gki && cd ~/gki
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest \
            -b "${{ inputs.branch }}"
          repo sync -c --no-tags --no-clone-bundle -j4

      - name: Atur nama kernel, BBR, dan WireGuard
        run: |
          cd ~/gki
          # check_defconfig membuat build gagal jika defconfig diubah
          sed -i 's/check_defconfig//' common/build.config.gki
          # nama versi kernel
          sed -i '/^CONFIG_LOCALVERSION=/d' common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_LOCALVERSION="-${{ inputs.kernel_name }}"' >> common/arch/arm64/configs/gki_defconfig
          # BBR sebagai default dan WireGuard. Algoritma TCP lain dimatikan
          cat >> common/arch/arm64/configs/gki_defconfig <<'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_WIREGUARD=y
          # CONFIG_TCP_CONG_BIC is not set
          # CONFIG_TCP_CONG_WESTWOOD is not set
          # CONFIG_TCP_CONG_HTCP is not set
          EOF

      - name: Build kernel
        run: |
          set -o pipefail
          cd ~/gki
          export BUILD_CONFIG=common/build.config.gki.aarch64
          if ! build/build.sh 2>&1 | tee ~/build.log | tail -n 100; then
            if grep -q "modules list out of date" ~/build.log; then
              echo "Daftar modul GKI berubah. Memperbarui daftar lalu build ulang."
              MO=$(find out -path '*/common/modules.order' | head -n1)
              cp "$MO" common/android/gki_aarch64_modules
              build/build.sh 2>&1 | tail -n 200
            else
              exit 1
            fi
          fi
          find out -name Image -type f

      - name: Cek config
        run: |
          CFG=$(find ~/gki/out -name .config -path '*common*' | head -n1)
          echo "Config: $CFG"
          grep -E 'CONFIG_TCP_CONG_BBR|CONFIG_DEFAULT_BBR|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_FQ=|CONFIG_WIREGUARD=|CONFIG_LOCALVERSION=' "$CFG" || true

      - name: Buat zip AnyKernel3
        run: |
          cd ~
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          IMG=$(find ~/gki/out -path '*dist*' -name Image -type f | head -n1)
          [ -n "$IMG" ] || { echo "Image tidak ditemukan di folder dist"; exit 1; }
          cp "$IMG" AnyKernel3/Image
          cd AnyKernel3
          rm -rf .git .github
          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Custom GKI android12-5.10
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF
          sed -i 's/^          //' anykernel.sh
          zip -r9 "../${{ inputs.kernel_name }}-$(date +%Y%m%d).zip" . -x "*.git*"

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_name }}
          path: |
            ~/*.zip
            ~/gki/out/**/dist/Image
